spring.application.name=conecta
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Datasource é montado em DataSourceConfig (suporta DATABASE_URL do Railway)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
conecta.jwt.secret=${JWT_SECRET:conecta-jwt-secret-key-change-in-production-must-be-at-least-256-bits-long-2026}
conecta.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (origens do frontend, separadas por vírgula)
conecta.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://conecta-beryl.vercel.app,https://conecta-g-nat4n.vercel.app}

# Uploads
conecta.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
