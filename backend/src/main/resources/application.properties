spring.application.name=conecta
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/rede
spring.datasource.username=postgres
spring.datasource.password=040501
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
conecta.jwt.secret=conecta-jwt-secret-key-change-in-production-must-be-at-least-256-bits-long-2026
conecta.jwt.expiration-ms=86400000

# CORS
conecta.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Uploads (local; preparado para serviço externo no futuro)
conecta.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
